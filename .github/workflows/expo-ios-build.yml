name: Expo iOS build
run-name: GigaCode iOS · ${{ inputs.artifact_type }} · ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      artifact_type:
        description: Unsigned device IPA, EAS-signed device IPA, or simulator app
        type: choice
        options:
          - unsigned-ipa
          - signed-ipa
          - simulator
        default: unsigned-ipa
        required: true
      api_url:
        description: Optional HTTPS API origin; leave blank to set it in the app's Connection screen
        type: string
        default: ''
        required: false

permissions:
  contents: read

concurrency:
  group: expo-ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
        working-directory: apps/expo
    env:
      CI: '1'
      EXPO_NO_DOTENV: '1'
      BUILD_TARGET: ${{ inputs.artifact_type }}
      EXPO_PUBLIC_API_URL: ${{ inputs.api_url || vars.EXPO_PUBLIC_API_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.13'

      - name: Check Xcode and public API configuration
        run: |
          set -euo pipefail
          xcodebuild -version
          pod --version
          node <<'NODE'
          const { execFileSync } = require('node:child_process');
          const version = execFileSync('xcodebuild', ['-version'], { encoding: 'utf8' });
          const match = /Xcode (\d+)\.(\d+)/.exec(version);
          if (!match || Number(match[1]) < 26 || (Number(match[1]) === 26 && Number(match[2]) < 4)) {
            throw new Error('Expo SDK 57 requires Xcode 26.4 or newer. Select a suitable macOS runner image.');
          }
          const api = process.env.EXPO_PUBLIC_API_URL;
          if (api) {
            const url = new URL(api);
            if (url.protocol !== 'https:' || url.username || url.password || url.search || url.hash || url.pathname !== '/') {
              throw new Error('api_url must be a public HTTPS origin without credentials, a path or query.');
            }
          }
          NODE

      - name: Install Expo dependencies
        run: bun install --frozen-lockfile

      - name: Cache CocoaPods downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/CocoaPods
            ~/.cocoapods/repos
          key: expo-ios-pods-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('apps/expo/bun.lock', 'apps/expo/app.json') }}
          restore-keys: expo-ios-pods-${{ runner.os }}-${{ runner.arch }}-

      - name: Generate iOS project with Expo Prebuild
        if: inputs.artifact_type != 'signed-ipa'
        run: bunx expo prebuild --platform ios --no-install --skip-dependency-update react,react-native

      - name: Install CocoaPods
        if: inputs.artifact_type != 'signed-ipa'
        run: pod install --project-directory=ios

      - name: Build Release artifact
        id: build
        if: inputs.artifact_type != 'signed-ipa'
        run: bash scripts/build-ios.sh "$BUILD_TARGET"

      - name: Build signed IPA on this Mac using EAS Local Build
        id: signed
        if: inputs.artifact_type == 'signed-ipa'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          [ -n "$EXPO_TOKEN" ] || { echo '::error::Set the EXPO_TOKEN repository secret; see docs/NATIVE_BUILDS.md.'; exit 1; }
          # EAS Local Build runs Expo Prebuild, CocoaPods, Xcode and signing on
          # this runner. It downloads the project's existing EAS credentials.
          mkdir -p build/ios-export/artifacts
          artifact="$PWD/build/ios-export/artifacts/GigaCode-signed.ipa"
          bunx eas-cli build --platform ios --profile preview --local --non-interactive --output "$artifact"
          unzip -t "$artifact"
          printf 'artifact_path=%s\n' "$artifact" >> "$GITHUB_OUTPUT"

      - name: Upload downloadable iOS artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: gigacode-ios-${{ inputs.artifact_type }}-${{ github.run_number }}
          path: ${{ steps.build.outputs.artifact_path || steps.signed.outputs.artifact_path }}
          if-no-files-found: error
          retention-days: 14

      - name: Download instructions
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          {
            echo '## GigaCode iOS build'
            printf '[Download the artifact](%s)\n\n' "$ARTIFACT_URL"
            if [ "$BUILD_TARGET" = unsigned-ipa ]; then
              echo 'Contains GigaCode-unsigned.ipa: a Release **iPhoneOS arm64** build with embedded JS and DOM assets.'
              echo 'This IPA is unsigned. Re-sign it with your own Apple signing identity/provisioning before installation.'
            elif [ "$BUILD_TARGET" = signed-ipa ]; then
              echo 'Contains GigaCode-signed.ipa: an EAS preview build signed for the registered devices in its provisioning profile.'
            else
              echo 'Contains GigaCode-simulator.app.tar.gz: an iOS Simulator app, not an installable iPhone IPA.'
            fi
            echo 'The execution backend is separate. Configure its HTTPS origin in Connection after installation.'
            echo 'See docs/NATIVE_BUILDS.md for installation and signed-IPA instructions.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Xcode log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gigacode-ios-build-log-${{ github.run_number }}
          path: apps/expo/build/ios-export/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7
