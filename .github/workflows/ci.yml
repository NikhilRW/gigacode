name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: app, POSTGRES_PASSWORD: app, POSTGRES_DB: engine }
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U app" --health-interval 2s --health-retries 30
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    env:
      DATABASE_URL: postgres://app:app@localhost:5432/engine
      REDIS_URL: redis://localhost:6379
      S3_ENDPOINT: http://localhost:9000
      S3_ACCESS_KEY_ID: minio
      S3_SECRET_ACCESS_KEY: minio12345
      S3_FORCE_PATH_STYLE: 'true'
      S3_BUCKET: engine-artifacts
      WORKER_DB_PASSWORD: worker-pass
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - name: Start MinIO
        run: docker run -d -p 9000:9000 -e MINIO_ROOT_USER=minio -e MINIO_ROOT_PASSWORD=minio12345 cgr.dev/chainguard/minio:latest server /data
      - run: pnpm install --frozen-lockfile
      - name: Dependency audit
        run: pnpm audit --prod --audit-level high
      - run: pnpm typecheck
      - run: pnpm lint
      - run: npx vitest run --project unit
      - run: npx tsx scripts/init-infra.ts
      - run: npx vitest run --project integration
      - run: pnpm --filter @engine/web build

  sandbox:
    # Builds the worker image and runs the self-test + abuse suite with real nsjail.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f infra/docker/worker.Dockerfile -t engine-worker:ci .
      - run: >
          docker run --rm --privileged --cgroupns=private --tmpfs /var/lib/worker/runs:mode=0711 engine-worker:ci
          sh -c 'pnpm --filter @engine/worker selftest && cd packages/sandbox && npx vitest run test/abuse'
