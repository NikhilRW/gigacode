name: code-exec-engine

x-app-env: &app-env
  NODE_ENV: development
  API_PORT: '3000'
  WEB_ORIGIN: http://localhost:5173
  JWT_SECRET: ${JWT_SECRET:-dev-only-jwt-secret-change-me-0123456789}
  COOKIE_SECURE: 'false'
  DATABASE_URL: postgres://app:app@postgres:5432/engine
  REDIS_URL: redis://redis:6379
  S3_ENDPOINT: http://minio:9000
  S3_PUBLIC_ENDPOINT: http://localhost:9000
  S3_REGION: us-east-1
  S3_BUCKET: engine-artifacts
  S3_ACCESS_KEY_ID: minio
  S3_SECRET_ACCESS_KEY: minio12345
  S3_FORCE_PATH_STYLE: 'true'
  RETENTION_DAYS: '30'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: engine
    ports: ['5432:5432']
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U app -d engine']
      interval: 2s
      retries: 30

  redis:
    image: redis:7-alpine
    ports: ['6379:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      retries: 30

  minio:
    # Docker Hub no longer serves minio/minio; Chainguard's build is used for local dev.
    image: cgr.dev/chainguard/minio:latest
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
    ports: ['9000:9000', '9001:9001']
    volumes: [miniodata:/data]

  migrate:
    build: { context: .., dockerfile: infra/docker/api.Dockerfile }
    # Applies SQL migrations, ensures the worker DB login, creates the S3 bucket and lifecycle rule.
    command: ['pnpm', 'exec', 'tsx', 'scripts/init-infra.ts']
    environment:
      <<: *app-env
      WORKER_DB_PASSWORD: ${WORKER_DB_PASSWORD:-worker-pass}
    depends_on:
      postgres: { condition: service_healthy }
      minio: { condition: service_started }

  api:
    build: { context: .., dockerfile: infra/docker/api.Dockerfile }
    environment:
      <<: *app-env
    ports: ['3000:3000']
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://localhost:3000/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 3s
      retries: 30

  worker:
    build: { context: .., dockerfile: infra/docker/worker.Dockerfile }
    # nsjail needs to create namespaces and manage a delegated cgroup v2 subtree.
    # On a real worker VM this runs as a systemd service instead (infra/worker-vm/).
    privileged: true
    cgroup: private
    environment:
      NODE_ENV: development
      WORKER_DATABASE_URL: postgres://worker_login:${WORKER_DB_PASSWORD:-worker-pass}@postgres:5432/engine
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: engine-artifacts
      S3_ACCESS_KEY_ID: minio
      S3_SECRET_ACCESS_KEY: minio12345
      S3_FORCE_PATH_STYLE: 'true'
      WORKER_SLOTS: '2'
      LEASE_SECONDS: '30'
      HEARTBEAT_SECONDS: '5'
      DRAIN_SECONDS: '30'
      SANDBOX_DRIVER: nsjail
      SANDBOX_ROOTFS_DIR: /opt/sandbox/rootfs
      NSJAIL_BIN: /usr/local/bin/nsjail
    tmpfs:
      - /var/lib/worker/runs:size=2g,mode=0700
    depends_on:
      api: { condition: service_healthy }

  web:
    build: { context: .., dockerfile: infra/docker/web.Dockerfile }
    ports: ['5173:80']
    depends_on:
      api: { condition: service_healthy }

volumes:
  pgdata:
  miniodata:
